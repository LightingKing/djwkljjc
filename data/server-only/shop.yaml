# 商店 (fci/Shop/) catalog for the local server.
#
# What comes from the 2.0.4 client (confidence A, read by economy.py):
#   - shop ids: window__ruleshop m_commonShopId = 1, m_EQUIP_SHOP_ID = 11,
#     common__util GuildShopId = 12 (the client hides 12 while guildId == 0);
#   - goods: every ItemInfo / EquipInfo row whose `sources` contains Goto 0
#     (Goto 0 = windowName "Shop"); the equip shop pool also covers every
#     DropDisplayShop (shopId 11) suit shown in the shop rule window;
#   - field names/semantics: ShopType, ApiShop.result, ApiShopGoods.*,
#     ApiShopTrade (descriptor set) and window__shop__shop.lua
#     (refreshFree = seconds until the next free refresh, refreshLimit = paid
#     refreshes per auto-refresh period, nextRefreshCost shown on the button).
# What is local policy (confidence D): the retired server's ShopType /
# ShopGoods / ShopSale / ShopManualRefresh tables are server-only
# (xlsx_server.proto) and were never shipped, so prices, limits, counts,
# chances, slot layout and refresh numbers below are chosen for offline play.
schemaVersion: 1
provenance:
  source: "client Lua shop ids + ItemInfo/EquipInfo sources (Goto 0) + DropDisplayShop; prices are local"
  confidence: D
  note: "Offline policy; not claimed to be the retired production catalog."
# Bump when the catalog changes: stored shops with an older version are rebuilt.
catalogVersion: 2
shops:
  - shopId: 1                     # 普通商店 (common shop)
    playerLevel: 1                # the Shop window itself unlocks at level 13
    refreshTimeInDay: "06:00:00"  # automatic refresh, daily (UTC like the rest of the server)
    refreshDayOfWeek: 0
    refreshDayOfMonth: 0
    refreshLimit: 5               # paid refreshes per automatic period
    refreshFree: 86400            # one free refresh every 24 h
    refreshCost: {type: 7, count: 10000}
    displayCost: [{type: 7}, {type: 5}]
    slots:
      - {pool: actorExp, count: 2}
      - {pool: equipExp, count: 2}
      - {pool: chips, count: 3}
      - {pool: rare, count: 1}
    pools:
      actorExp:                   # ItemInfo funcType 1, sources [0, 19, 27]
        - {shopGoodId: 101, good: {type: 11, id: 10001, count: 10}, cost: [{type: 7, count: 5000}], buyLimit: 2, chance: 40}
        - {shopGoodId: 102, good: {type: 11, id: 10002, count: 5}, cost: [{type: 7, count: 7500}], buyLimit: 2, chance: 30}
        - {shopGoodId: 103, good: {type: 11, id: 10003, count: 3}, cost: [{type: 7, count: 12000}], buyLimit: 2, chance: 20}
        - {shopGoodId: 104, good: {type: 11, id: 10004, count: 2}, cost: [{type: 7, count: 15000}], buyLimit: 1, chance: 10}
      equipExp:                   # ItemInfo funcType 2, sources [0, 19, 23, 27]
        - {shopGoodId: 201, good: {type: 11, id: 40001, count: 10}, cost: [{type: 7, count: 1500}], buyLimit: 2, chance: 35}
        - {shopGoodId: 202, good: {type: 11, id: 40002, count: 5}, cost: [{type: 7, count: 4000}], buyLimit: 2, chance: 30}
        - {shopGoodId: 203, good: {type: 11, id: 40003, count: 3}, cost: [{type: 7, count: 7200}], buyLimit: 2, chance: 20}
        - {shopGoodId: 204, good: {type: 11, id: 40004, count: 2}, cost: [{type: 7, count: 12800}], buyLimit: 1, chance: 10}
        - {shopGoodId: 205, good: {type: 11, id: 40005, count: 1}, cost: [{type: 7, count: 12000}], buyLimit: 1, chance: 5}
      chips:                      # actor chips (ItemInfo funcType 3) sold in the shop
        generate: {table: ItemInfo, source: 0, funcType: 3, quality: 2}
        shopGoodIdBase: 1000000   # shopGoodId = base + item id
        count: 5
        cost: [{type: 7, count: 30000}]
        buyLimit: 1
        chance: 10
      rare:                       # remaining Goto-0 items
        - {shopGoodId: 401, good: {type: 11, id: 52001, count: 1}, cost: [{type: 5, count: 200}], buyLimit: 1, chance: 40}
        - {shopGoodId: 402, good: {type: 11, id: 90001, count: 1}, cost: [{type: 5, count: 300}], buyLimit: 1, chance: 30}
        - {shopGoodId: 403, good: {type: 11, id: 60001, count: 1}, cost: [{type: 5, count: 500}], buyLimit: 1, chance: 30}

  - shopId: 11                    # 装备商店 (equip shop, RuleShop shows DropDisplayShop suits)
    playerLevel: 1
    refreshTimeInDay: "06:00:00"
    refreshDayOfWeek: 0
    refreshDayOfMonth: 0
    refreshLimit: 5
    refreshFree: 86400
    refreshCost: {type: 7, count: 20000}
    displayCost: [{type: 7}]
    levelWindow: 10               # offer equips with requireLevel <= player level + 10
    slots:
      - {pool: equips, count: 6}
    pools:
      equips:
        generate: {table: EquipInfo, source: 0}
        shopGoodIdBase: 2000000   # shopGoodId = base + equip id
        count: 1
        costByQuality:
          2: [{type: 7, count: 20000}]
          3: [{type: 7, count: 60000}]
          4: [{type: 7, count: 150000}]
        chanceByQuality: {2: 30, 3: 20, 4: 10}
        buyLimit: 1

  - shopId: 12                    # 公会商店 (guild shop; client hides it without a guild)
    playerLevel: 23               # UnlockWindow_Guild unlocks at level 23
    guild: true
    refreshTimeInDay: "06:00:00"
    refreshDayOfWeek: 1           # weekly, Monday
    refreshDayOfMonth: 0
    refreshLimit: 0               # no paid refresh
    refreshFree: 0                # no free refresh
    displayCost: [{type: 17}]     # ResGuildScore
    slots:
      - {pool: guildExp, count: 3}
      - {pool: guildChips, count: 3}
    pools:
      guildExp:
        - {shopGoodId: 501, good: {type: 11, id: 10003, count: 5}, cost: [{type: 17, count: 200}], buyLimit: 2, chance: 30}
        - {shopGoodId: 502, good: {type: 11, id: 40003, count: 5}, cost: [{type: 17, count: 150}], buyLimit: 2, chance: 30}
        - {shopGoodId: 503, good: {type: 11, id: 10004, count: 3}, cost: [{type: 17, count: 300}], buyLimit: 1, chance: 20}
        - {shopGoodId: 504, good: {type: 11, id: 40004, count: 3}, cost: [{type: 17, count: 250}], buyLimit: 1, chance: 20}
      guildChips:
        generate: {table: ItemInfo, source: 0, funcType: 3, quality: 2}
        shopGoodIdBase: 3000000
        count: 5
        cost: [{type: 17, count: 400}]
        buyLimit: 1
        chance: 10

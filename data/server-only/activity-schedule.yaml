schemaVersion: 1
provenance:
  source: local compatibility policy; historical production schedule is unavailable
  confidence: D
  note: "The scheduler is a deterministic local loop. Replace entries with dated archives when recovered."
timezone: Asia/Shanghai
resetPolicyVersion: 1
cycle:
  periodDays: 28
  anchor: "2026-10-26T06:00:00+08:00"
  phases:
    - id: sign-in
      dayStart: 0
      dayEnd: 28
      activityType: 46
    - id: shop
      dayStart: 0
      dayEnd: 28
      activityType: 12
    - id: sandbox-gacha
      # ContinuousLogin keeps its tab open for the complete local cycle;
      # this phase only supplies the cycle timestamps to the client.
      dayStart: 0
      dayEnd: 28
      forever: true
      activityType: 25
    - id: diff-actor-inherit
      dayStart: 0
      dayEnd: 28
      activityType: 33
      activityId: 33001
management:
  adminEndpoint: /__local__/admin/activity-schedule
  canAdjustAnchor: true
# Permanent challenge-menu (挑战/活动) modes, served by events.py as always-open
# GET fci/activity/ records.  Window_Activity lists only category
# WeeklyActivity(1)/Tournament(3) records whose type is in an ActivitySort row,
# shows a group while ACU.IsActivitiesOn holds and locks it below the
# PlayerLevelInitConfig.unlockWindow level of
# WU.ActivityTypeToUnlockWindowType(type).  When a schedule service is
# attached its document is authoritative: omit this section to list none.
permanentActivities:
  provenance:
    source: "client 2.0.4: xlsx ActivitySort/ActivityDungeon/PlayerLevelInitConfig; window__activity__activity.lua; common__activityutil.lua; window__activitystagechoose__*.lua"
    confidence: B
    note: >-
      Types, categories, the always-open window and CollectionDungeon ids 2001-2003
      are client evidence.  The historical weekday rotation and the ids of the
      single-entry modes are unavailable: weekdays below are a local policy that
      opens at least one material dungeon every day (ActivityStageChoose indexes
      the first IsOpenForDoing entry unconditionally, all three on Sunday) and
      single-entry ids follow the client's type*1000+1 numbering (25001, 46001).
      Weekdays are client weekdays (Monday=1 .. Sunday=7) evaluated on
      CS.GameTime.serverNow.
  defaults:
    category: 1   # ActivityCategory_WeeklyActivity
    timeType: 1   # ActivityTimeType_Forever -> menu row "Window_OpenForever"
  entries:
    # Original ActivityGachaLimited/GachaAd rows.  Dates were server-only;
    # the local schedule keeps all three original selections available.
    - id: limited-gacha-4001
      type: 4
      activityId: 4001
    - id: limited-gacha-4002
      type: 4
      activityId: 4002
    - id: limited-gacha-4003
      type: 4
      activityId: 4003
    - id: collection-2001
      type: 2            # CollectionDungeon -> ActivityStageChoose2 (UnlockWindow 7, Lv10; forced tutorial 14/15)
      activityId: 2001   # ActivityDungeon 2001 (dungeons 52101-52110, multipleActivityId 2101)
      weekdays: [1, 4, 7]
    - id: collection-2002
      type: 2
      activityId: 2002   # ActivityDungeon 2002 (52201-52210, multipleActivityId 2102)
      weekdays: [2, 5, 7]
    - id: collection-2003
      type: 2
      activityId: 2003   # ActivityDungeon 2003 (52301-52310, multipleActivityId 2103)
      weekdays: [3, 6, 7]
    - id: tower
      type: 3            # Tower -> window Tower (UnlockWindow 9, Lv16)
      activityId: 3001
    - id: gold-dungeon
      type: 17           # GoldDungeon -> window DungeonGold (UnlockWindow 18, Lv18)
      activityId: 17001
    - id: team-dungeon
      type: 23           # DungeonTeam -> window DungeonTeam (local AI teammates)
      activityId: 23001
      levelLimit: 30
      weekdays: [1, 2, 3, 4, 5, 6, 7]
    - id: challenge-mode
      type: 30           # ChallengeMode -> ChapterChallenge (UnlockWindow 16, Lv18)
      activityId: 30001
    - id: deploy-mission
      type: 10           # DeployMission -> window Deploy (UnlockWindow 13, Lv20)
      activityId: 10001
    - id: triggered-event
      type: 31           # TriggeredEvent -> window TriggeredEvent (UnlockWindow 32, Lv32)
      activityId: 31001
    - id: race-pvp
      type: 20
      activityId: 20001
    - id: async-pvp
      type: 5           # Tournament_AsyncPvp / 虚像之境
      activityId: 5001
      category: 3
      levelLimit: 23
    - id: burstlink
      type: 18          # BurstLinkPvp / 超频连线
      activityId: 18001
      category: 3
      levelLimit: 28
    - id: actor-cultivation-1502
      type: 53
      activityId: 53001
    - id: actor-cultivation-1514
      type: 53
      activityId: 53002
    - id: diff-actor-inherit
      type: 33           # DiffActorInherit; whitelist is the exported 33001 row
      activityId: 33001
    - id: condition-reward
      type: 35           # True-love contract manual actor choice
      activityId: 35001
    - id: maze
      type: 34           # Local Maze entry; client widgets/routes are present
      activityId: 34001
      levelLimit: 30
    - id: seal
      type: 16           # Welfare tab Seal16
      activityId: 16001
    - id: chip-exchange
      type: 44           # Welfare tab ChipExchange44
      activityId: 44001
    - id: postcard
      type: 26           # Welfare tab Postcard26
      activityId: 26001
    - id: jigsaw
      type: 48           # Welfare tab Jigsaw48
      activityId: 48001
    - id: theme-tasks
      type: 43           # Welfare tab Theme43
      activityId: 43001
    # Not listed:
    # - EventDungeon (27), EventDungeon_Autumn2018(+Hard) (39/40),
    #   RacePVPActivity (42): dated events, schedule them as phases instead.
